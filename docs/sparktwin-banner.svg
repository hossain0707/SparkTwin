<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
<title id="t">SparkTwin — Know before you deploy</title><desc id="d">Animated concept artwork showing an AI model's memory budget on a local-first capacity planner. All bars are illustrative, not live benchmark readings.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111E"/><stop offset=".48" stop-color="#10293B"/><stop offset="1" stop-color="#071A2B"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48E4BB"/><stop offset="1" stop-color="#7EB8FF"/></linearGradient>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19394A"/><stop offset="1" stop-color="#11293C"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2CE2BC" stop-opacity=".16"/><stop offset="1" stop-color="#2CE2BC" stop-opacity="0"/></radialGradient>
</defs>
<style>
.orbit{transform-origin:1011px 239px;animation:orbit 28s linear infinite}.orbitB{transform-origin:1011px 239px;animation:orbit 39s linear reverse infinite}
.breathe{animation:breathe 6s ease-in-out infinite}.tracer{stroke-dasharray:12 18;animation:dash 8s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.45;transform:translateY(-4px)}}@keyframes dash{to{stroke-dashoffset:-120}}
@media(prefers-reduced-motion:reduce){.orbit,.orbitB,.breathe,.tracer{animation:none}}
</style>
<rect width="1280" height="480" rx="25" fill="url(#bg)"/>
<circle cx="1010" cy="236" r="301" fill="url(#glow)"/>
<g opacity=".25" stroke="#31536B" stroke-width="1"><path d="M50 400H1230M50 320H1230M50 240H1230M50 160H1230M50 80H1230M180 38V441M340 38V441M500 38V441M660 38V441M820 38V441M980 38V441M1140 38V441"/></g>
<g transform="translate(56 38)">
<rect width="49" height="49" rx="15" fill="#194339" stroke="#4CD9B8"/>
<circle cx="24.5" cy="24.5" r="14" fill="none" stroke="#78F2CC" stroke-width="2.5"/><ellipse cx="24.5" cy="24.5" rx="8" ry="18" transform="rotate(45 24.5 24.5)" fill="none" stroke="#8CB9FF" stroke-width="2"/><circle cx="24.5" cy="24.5" r="4" fill="#6DF0C7"/>
</g>
<text x="123" y="71" font-family="Arial,sans-serif" font-size="28" fill="#F0FAFF" font-weight="700">SparkTwin</text>
<rect x="292" y="44" width="160" height="28" rx="14" fill="#1B3A48" stroke="#2C6372"/><text x="372" y="63" text-anchor="middle" fill="#A9F5DB" font-family="Arial,sans-serif" font-size="12" font-weight="700">DEVELOPER PREVIEW</text>
<text x="55" y="145" font-family="Arial,sans-serif" font-size="13" fill="#73DAC1" font-weight="700" letter-spacing="2.5">LOCAL-FIRST AI CAPACITY INTELLIGENCE</text>
<text x="51" y="214" font-family="Arial,sans-serif" font-size="55" fill="#F3FAFF" font-weight="700" letter-spacing="-1.6">Know before</text>
<text x="51" y="277" font-family="Arial,sans-serif" font-size="55" fill="url(#mint)" font-weight="700" letter-spacing="-1.6">you deploy.</text>
<text x="56" y="324" font-family="Arial,sans-serif" font-size="19" fill="#B1CBD8">Model memory. Explore trade-offs. Ground decisions in evidence.</text>
<text x="56" y="354" font-family="Arial,sans-serif" font-size="15" fill="#91AEBD">DGX Spark and custom unified-memory inference hosts</text>
<rect x="55" y="399" width="194" height="39" rx="10" fill="#194438" stroke="#39785F"/><text x="152" y="424" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#D3FFEC">PRIVATE BY DEFAULT</text>
<rect x="265" y="399" width="187" height="39" rx="10" fill="#1D3447" stroke="#365D76"/><text x="358" y="424" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#D5E9F9">WIN · MAC · LINUX</text>
<g class="orbit"><ellipse cx="1011" cy="239" rx="245" ry="102" transform="rotate(28 1011 239)" fill="none" stroke="#56D6B7" stroke-opacity=".55" stroke-width="2"/><circle cx="1251" cy="239" r="7" fill="#69EFC9"/></g>
<g class="orbitB"><ellipse cx="1011" cy="239" rx="168" ry="224" transform="rotate(24 1011 239)" fill="none" stroke="#80B6FE" stroke-opacity=".45" stroke-width="2"/><circle cx="1011" cy="15" r="7" fill="#80B6FE"/></g>
