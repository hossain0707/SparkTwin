<text x="80" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#EDFAFF">Responsive desktop UI</text><text x="80" y="234" font-family="Arial,sans-serif" font-size="13" fill="#A7C5D3">Browser / optional native shell</text>
<rect x="383" y="171" width="526" height="100" rx="12" fill="url(#pane)" stroke="#407184"/>
<text x="405" y="203" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#EDFAFF">Loopback HTTP controller</text>
<text x="405" y="229" font-family="Arial,sans-serif" font-size="13" fill="#A7C5D3">127.0.0.1 · session token · Origin checks</text>
<rect x="60" y="343" width="272" height="103" rx="12" fill="url(#pane)" stroke="#407184"/>
<text x="80" y="376" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#EDFAFF">Capacity model</text><text x="80" y="403" font-family="Arial,sans-serif" font-size="13" fill="#A7C5D3">Memory and scenario math</text>
<rect x="350" y="343" width="267" height="103" rx="12" fill="url(#pane)" stroke="#407184"/>
<text x="370" y="376" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#EDFAFF">Evidence store</text><text x="370" y="403" font-family="Arial,sans-serif" font-size="13" fill="#A7C5D3">Local SQLite observations</text>
<rect x="636" y="343" width="273" height="103" rx="12" fill="url(#pane)" stroke="#407184"/>
<text x="655" y="376" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#EDFAFF">PDF reports</text><text x="655" y="403" font-family="Arial,sans-serif" font-size="13" fill="#A7C5D3">Scope and provenance</text>
