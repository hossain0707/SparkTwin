<text x="951" y="211" font-family="Arial,sans-serif" font-size="12" text-anchor="end" fill="#99DFCE">OpenSSH</text>
<text x="48" y="510" font-family="Arial,sans-serif" font-size="14" fill="#A5C4D0">No cloud telemetry. The application functions offline for scenario planning.</text>
<text x="48" y="579" font-family="Arial,sans-serif" font-size="13" fill="#84A4B6">Logical data-flow animation only · Hardware connectivity and external production acceptance require real-device testing.</text>
