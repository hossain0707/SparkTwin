<text x="994" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#EFF9FE">DGX Spark / Linux host</text>
<text x="994" y="243" font-family="Arial,sans-serif" font-size="14" fill="#B8D2DC">Optional, read-only SSH</text>
<text x="994" y="272" font-family="Arial,sans-serif" font-size="13" fill="#B8D2DC">Host memory + OS</text>
<text x="994" y="299" font-family="Arial,sans-serif" font-size="13" fill="#B8D2DC">NVIDIA GPU identity</text>
