<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="555" viewBox="0 0 1280 555" role="img" aria-labelledby="t d"><title id="t">SparkTwin implemented technical architecture</title><desc id="d">A local browser talks to a loopback local HTTP controller with modeling engine. SQLite stores scenarios and user-imported observations. The PDF generator exports reports. Optional OpenSSH read-only host snapshots; no remote execution agent.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081523"/><stop offset="1" stop-color="#102b3e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#6feacc"/></marker></defs><style>.line{stroke:#6feacc;stroke-width:2;stroke-dasharray:8 10;animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><rect width="1280" height="555" rx="22" fill="url(#bg)"/><text x="52" y="59" font-size="29" fill="#f1fcff" font-family="Arial,sans-serif" font-weight="700">Local-first architecture</text><text x="52" y="86" font-size="15" fill="#a0c0ce" font-family="Arial,sans-serif">Actual v0.1 implementation, not a planned remote agent architecture</text><rect x="43" y="109" width="908" height="380" rx="19" fill="#112332" stroke="#315367"/><text x="69" y="145" font-size="16" fill="#a0e5cc" font-family="Arial,sans-serif" font-weight="700">WINDOWS · MACOS · LINUX · OPERATOR COMPUTER</text><rect x="69" y="172" width="283" height="91" rx="12" fill="#183346" stroke="#3f6b78"/><rect x="70" y="173" width="5" height="89" rx="2" fill="#55e6c2"/><text x="87" y="208" fill="#e8f9ff" font-size="17" font-family="Arial,sans-serif" font-weight="700">Web user interface</text><text x="87" y="236" fill="#9fbccd" font-size="13" font-family="Arial,sans-serif">Responsive, no external CDNs</text><rect x="383" y="172" width="539" height="91" rx="12" fill="#183346" stroke="#3f6b78"/><rect x="384" y="173" width="5" height="89" rx="2" fill="#55e6c2"/><text x="401" y="208" fill="#e8f9ff" font-size="17" font-family="Arial,sans-serif" font-weight="700">Local HTTP controller</text><text x="401" y="236" fill="#9fbccd" font-size="13" font-family="Arial,sans-serif">127.0.0.1 + random session token</text><rect x="69" y="342" width="270" height="92" rx="12" fill="#183346" stroke="#3f6b78"/><rect x="70" y="343" width="5" height="90" rx="2" fill="#55e6c2"/><text x="87" y="378" fill="#e8f9ff" font-size="17" font-family="Arial,sans-serif" font-weight="700">Scenario / memory engine</text><text x="87" y="406" fill="#9fbccd" font-size="13" font-family="Arial,sans-serif">Deterministic equations</text><rect x="369" y="342" width="260" height="92" rx="12" fill="#183346" stroke="#3f6b78"/><rect x="370" y="343" width="5" height="90" rx="2" fill="#55e6c2"/><text x="387" y="378" fill="#e8f9ff" font-size="17" font-family="Arial,sans-serif" font-weight="700">SQLite workspace</text><text x="387" y="406" fill="#9fbccd" font-size="13" font-family="Arial,sans-serif">Private scenarios + observations</text><rect x="660" y="342" width="262" height="92" rx="12" fill="#183346" stroke="#3f6b78"/><rect x="661" y="343" width="5" height="90" rx="2" fill="#55e6c2"/><text x="678" y="378" fill="#e8f9ff" font-size="17" font-family="Arial,sans-serif" font-weight="700">PDF report generator</text><text x="678" y="406" fill="#9fbccd" font-size="13" font-family="Arial,sans-serif">Uncertainties explicitly recorded</text><path class="line" d="M353 216H383" marker-end="url(#arrow)" fill="none"/><path class="line" d="M643 263V303H204V342" marker-end="url(#arrow)" fill="none"/><path class="line" d="M662 263V303H499V342" marker-end="url(#arrow)" fill="none"/><path class="line" d="M684 263V342" marker-end="url(#arrow)" fill="none"/><rect x="985" y="150" width="248" height="224" rx="17" fill="#1d2c37" stroke="#385869" stroke-dasharray="6 6"/><text x="1005" y="190" font-family="Arial,sans-serif" font-size="17" fill="#dceaf4" font-weight="700">DGX Spark host</text><text x="1005" y="228" font-family="Arial,sans-serif" font-size="13" fill="#acc4cb">Not connected in v0.1</text><text x="1005" y="259" font-family="Arial,sans-serif" font-size="12" fill="#91b3bc">Future optional SSH</text><text x="1005" y="282" font-family="Arial,sans-serif" font-size="12" fill="#91b3bc">and benchmark capture</text><text x="1005" y="316" font-family="Arial,sans-serif" font-size="12" fill="#7da398">No device access required</text><text x="52" y="527" font-family="Arial,sans-serif" font-size="13" fill="#8ba8b8">Security: session token · no cloud API requests · local SQLite · no cloud telemetry · read-only optional SSH inspection</text></svg>