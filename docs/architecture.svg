<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img" aria-labelledby="t d">
<title id="t">SparkTwin local-first application architecture</title><desc id="d">The user interface runs on the local computer and talks to a localhost-only controller. The deterministic capacity engine and benchmark calibration work locally, with SQLite and PDF reporting. Optional OpenSSH reads host information from a DGX Spark without installing an agent.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111E"/><stop offset=".48" stop-color="#10293B"/><stop offset="1" stop-color="#071A2B"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48E4BB"/><stop offset="1" stop-color="#7EB8FF"/></linearGradient>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19394A"/><stop offset="1" stop-color="#11293C"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2CE2BC" stop-opacity=".16"/><stop offset="1" stop-color="#2CE2BC" stop-opacity="0"/></radialGradient>
</defs>
<style>
.link{stroke:#58DABB;stroke-width:2.2;stroke-dasharray:8 12;fill:none;animation:move 7s linear infinite}
@keyframes move{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.link{animation:none}}
</style><rect width="1280" height="610" rx="22" fill="url(#bg)"/>
<text x="48" y="57" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#F4FBFF">Architecture: local control, optional remote inspection</text>
<text x="48" y="85" font-family="Arial,sans-serif" font-size="15" fill="#A8C0CF">Implementation-oriented view of the v0.1 development application</text>
<rect x="36" y="115" width="908" height="432" rx="20" fill="#0E2636" stroke="#3A6274"/>
<text x="60" y="148" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#79E9C8">OPERATOR COMPUTER · WINDOWS / MACOS / LINUX</text>
