<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370" width="1280" height="370" role="img" aria-labelledby="t d">
<title id="t">SparkTwin animated five-step planning workflow</title><desc id="d">An illustrative sequence highlighting Configure, Estimate, Compare, Calibrate, and Report. The sequence does not represent a live DGX Spark execution.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111E"/><stop offset=".48" stop-color="#10293B"/><stop offset="1" stop-color="#071A2B"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48E4BB"/><stop offset="1" stop-color="#7EB8FF"/></linearGradient>
  <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19394A"/><stop offset="1" stop-color="#11293C"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2CE2BC" stop-opacity=".16"/><stop offset="1" stop-color="#2CE2BC" stop-opacity="0"/></radialGradient>
</defs>
<style>
.active{opacity:.14;animation:focus 15s ease-in-out infinite}.a0{animation-delay:0s}.a1{animation-delay:-12s}.a2{animation-delay:-9s}.a3{animation-delay:-6s}.a4{animation-delay:-3s}
.dash{stroke-dasharray:7 13;animation:slide 9s linear infinite}
@keyframes focus{0%,18%{opacity:1}21%,100%{opacity:.14}}@keyframes slide{to{stroke-dashoffset:-120}}
@media(prefers-reduced-motion:reduce){.active{animation:none;opacity:.7}.dash{animation:none}}
</style><rect width="1280" height="370" rx="22" fill="url(#bg)"/>
<text x="49" y="57" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#F0F9FE">One clear workflow. Evidence at every step.</text>
<text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#A2BECB">Capacity decisions, with transparent assumptions and explicit confidence limits.</text>
<path d="M150 121H1132" stroke="#254F5E" stroke-width="4" fill="none"/><path class="dash" d="M150 121H1132" stroke="#61DCC0" stroke-width="2" fill="none"/>
<g font-family="Arial,sans-serif"><g><rect x="48" y="141" width="219" height="143" rx="16" fill="#132D3E" stroke="#345568"/><rect x="65" y="158" width="44" height="28" rx="9" fill="#1D514B"/><text x="87" y="177" font-size="13" font-weight="700" fill="#A4F5D9" text-anchor="middle">01</text><text x="65" y="222" font-size="22" font-weight="700" fill="#F0FAFF">Configure</text><text x="65" y="250" font-size="12" fill="#A9C6D5">Device, geometry, context</text><rect x="48" y="287" width="219" height="4" rx="2" fill="#245161"/><rect class="active a0" x="48" y="287" width="219" height="4" rx="2" fill="#62E5C1"/></g><g><rect x="293" y="141" width="219" height="143" rx="16" fill="#132D3E" stroke="#345568"/><rect x="310" y="158" width="44" height="28" rx="9" fill="#1D514B"/><text x="332" y="177" font-size="13" font-weight="700" fill="#A4F5D9" text-anchor="middle">02</text><text x="310" y="222" font-size="22" font-weight="700" fill="#F0FAFF">Estimate</text><text x="310" y="250" font-size="12" fill="#A9C6D5">Weights, KV and reserves</text><rect x="293" y="287" width="219" height="4" rx="2" fill="#245161"/><rect class="active a1" x="293" y="287" width="219" height="4" rx="2" fill="#62E5C1"/></g><g><rect x="538" y="141" width="219" height="143" rx="16" fill="#132D3E" stroke="#345568"/><rect x="555" y="158" width="44" height="28" rx="9" fill="#1D514B"/><text x="577" y="177" font-size="13" font-weight="700" fill="#A4F5D9" text-anchor="middle">03</text><text x="555" y="222" font-size="22" font-weight="700" fill="#F0FAFF">Compare</text><text x="555" y="250" font-size="12" fill="#A9C6D5">What-if scenarios</text><rect x="538" y="287" width="219" height="4" rx="2" fill="#245161"/><rect class="active a2" x="538" y="287" width="219" height="4" rx="2" fill="#62E5C1"/></g><g><rect x="783" y="141" width="219" height="143" rx="16" fill="#132D3E" stroke="#345568"/><rect x="800" y="158" width="44" height="28" rx="9" fill="#1D514B"/><text x="822" y="177" font-size="13" font-weight="700" fill="#A4F5D9" text-anchor="middle">04</text><text x="800" y="222" font-size="22" font-weight="700" fill="#F0FAFF">Calibrate</text><text x="800" y="250" font-size="12" fill="#A9C6D5">Import measured evidence</text><rect x="783" y="287" width="219" height="4" rx="2" fill="#245161"/><rect class="active a3" x="783" y="287" width="219" height="4" rx="2" fill="#62E5C1"/></g><g><rect x="1028" y="141" width="219" height="143" rx="16" fill="#132D3E" stroke="#345568"/><rect x="1045" y="158" width="44" height="28" rx="9" fill="#1D514B"/><text x="1067" y="177" font-size="13" font-weight="700" fill="#A4F5D9" text-anchor="middle">05</text><text x="1045" y="222" font-size="22" font-weight="700" fill="#F0FAFF">Report</text><text x="1045" y="250" font-size="12" fill="#A9C6D5">Export traceable PDF</text><rect x="1028" y="287" width="219" height="4" rx="2" fill="#245161"/><rect class="active a4" x="1028" y="287" width="219" height="4" rx="2" fill="#62E5C1"/></g></g>
<text x="50" y="337" font-family="Arial,sans-serif" font-size="13" fill="#86A6B6">Illustrative product flow. Calibration is available only when real benchmark observations are supplied.</text></svg>