<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d"><title id="t">SparkTwin modeling workflow</title><desc id="d">Illustrative steps: define device and model, run transparent memory analysis, compare scenarios, import observed benchmarks, export evidence report.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#132e3f"/></linearGradient></defs><style>.path{stroke-dasharray:8 12;animation:move 5s linear infinite}@keyframes move{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.path{animation:none}}</style><rect width="1280" height="300" rx="20" fill="url(#bg)"/><text x="55" y="57" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#eafaff">The SparkTwin workflow</text><text x="55" y="82" font-family="Arial,sans-serif" font-size="14" fill="#88a9b8">Each result is traceable to explicit inputs; measured throughput is never invented.</text><path class="path" d="M156 167H1122" fill="none" stroke="#51e5c1" stroke-width="3"/><g font-family="Arial,sans-serif"><rect x="56" y="115" width="208" height="126" rx="14" fill="#142b3b" stroke="#36576a"/><rect x="71" y="133" width="43" height="29" rx="8" fill="#1f534e"/><text x="92" y="153" font-size="13" fill="#b2f9e0" font-weight="700" text-anchor="middle">01</text><text x="72" y="194" font-size="18" fill="#edfaff" font-weight="700">Configure</text><text x="72" y="219" font-size="12" fill="#97b4c5">Device + model</text><rect x="302" y="115" width="208" height="126" rx="14" fill="#142b3b" stroke="#36576a"/><rect x="317" y="133" width="43" height="29" rx="8" fill="#1f534e"/><text x="338" y="153" font-size="13" fill="#b2f9e0" font-weight="700" text-anchor="middle">02</text><text x="318" y="194" font-size="18" fill="#edfaff" font-weight="700">Analyze</text><text x="318" y="219" font-size="12" fill="#97b4c5">Memory budget</text><rect x="548" y="115" width="208" height="126" rx="14" fill="#142b3b" stroke="#36576a"/><rect x="563" y="133" width="43" height="29" rx="8" fill="#1f534e"/><text x="584" y="153" font-size="13" fill="#b2f9e0" font-weight="700" text-anchor="middle">03</text><text x="564" y="194" font-size="18" fill="#edfaff" font-weight="700">Compare</text><text x="564" y="219" font-size="12" fill="#97b4c5">2–8 scenarios</text><rect x="794" y="115" width="208" height="126" rx="14" fill="#142b3b" stroke="#36576a"/><rect x="809" y="133" width="43" height="29" rx="8" fill="#1f534e"/><text x="830" y="153" font-size="13" fill="#b2f9e0" font-weight="700" text-anchor="middle">04</text><text x="810" y="194" font-size="18" fill="#edfaff" font-weight="700">Calibrate</text><text x="810" y="219" font-size="12" fill="#97b4c5">Measured values</text><rect x="1040" y="115" width="208" height="126" rx="14" fill="#142b3b" stroke="#36576a"/><rect x="1055" y="133" width="43" height="29" rx="8" fill="#1f534e"/><text x="1076" y="153" font-size="13" fill="#b2f9e0" font-weight="700" text-anchor="middle">05</text><text x="1056" y="194" font-size="18" fill="#edfaff" font-weight="700">Report</text><text x="1056" y="219" font-size="12" fill="#97b4c5">PDF + export</text></g><text x="55" y="274" font-family="Arial,sans-serif" font-size="12" fill="#779bab">Conceptual process animation • Not a measured workload execution</text></svg>