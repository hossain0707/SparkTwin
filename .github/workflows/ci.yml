name: SparkTwin — Test, Package, Publish Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: node --check sparktwin/web/app.js
      - name: Validate desktop source assets
        run: python desktop_launcher.py --self-test

  desktop-build:
    name: Package (${{ matrix.id }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-2022, platform: windows }
          - { id: macos-intel, os: macos-15-intel, platform: macos }
          - { id: macos-arm64, os: macos-15, platform: macos }
          - { id: linux-x64, os: ubuntu-24.04, platform: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux GUI requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libgirepository-2.0-0 dpkg-dev
      - name: Install packaging dependencies
        run: python -m pip install -e ".[build]"
      - name: Build standalone SparkTwin app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name SparkTwin --add-data 'sparktwin/web:sparktwin/web' \
            --collect-all webview desktop_launcher.py
      - name: Verify Windows packaged binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/SparkTwin/SparkTwin.exe').Path -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows packaged self-test failed: $($process.ExitCode)" }
      - name: Verify Unix packaged binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            ./dist/SparkTwin.app/Contents/MacOS/SparkTwin --self-test
          else
            ./dist/SparkTwin/SparkTwin --self-test
          fi
      - name: Create Windows setup installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/SparkTwin -DestinationPath dist/release/SparkTwin-Portable-Windows-x64.zip -CompressionLevel Optimal
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 'installer/SparkTwin.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Create drag-to-Applications macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/release dist/dmg-stage
          cp -R dist/SparkTwin.app dist/dmg-stage/
          ln -s /Applications dist/dmg-stage/Applications
          if [ '${{ matrix.id }}' = macos-arm64 ]; then label=Apple-Silicon; else label=Intel; fi
          hdiutil create -volname 'SparkTwin Preview' -srcfolder dist/dmg-stage -ov -format UDZO "dist/release/SparkTwin-macOS-${label}-unsigned.dmg"
      - name: Create Ubuntu DEB and Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/release
          tar -czf dist/release/SparkTwin-Portable-Linux-x64.tar.gz -C dist SparkTwin
          bash scripts/package_deb.sh
          mv SparkTwin-Linux-x64-preview.deb dist/release/SparkTwin-Linux-Ubuntu-x64.deb
      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: SparkTwin-distribution-${{ matrix.id }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  preview-release:
    name: Publish tagged unsigned preview release
    needs: [test, desktop-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SparkTwin-distribution-*
          path: release-assets
          merge-multiple: true
      - name: Verify every platform and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for filename in \
            SparkTwin-Setup-Windows-x64.exe \
            SparkTwin-Portable-Windows-x64.zip \
            SparkTwin-macOS-Apple-Silicon-unsigned.dmg \
            SparkTwin-macOS-Intel-unsigned.dmg \
            SparkTwin-Linux-Ubuntu-x64.deb \
            SparkTwin-Portable-Linux-x64.tar.gz; do
            test -s "$filename" || { echo "Missing or empty release asset: $filename"; exit 1; }
          done
          sha256sum SparkTwin-* > SHA256SUMS.txt
          ls -lh
      - name: Create immutable pre-release tag with downloadable installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SparkTwin v0.1.0 · Unsigned Preview #${GITHUB_RUN_NUMBER}" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md
